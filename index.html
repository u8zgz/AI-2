<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein kostenloser Gemini Chat</title>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1f20;
            --text-color: #e3e3e3;
            --input-bg: #282a2d;
            --accent-color: #4b90ff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--chat-bg);
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .gemini-message {
            background-color: var(--chat-bg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #input-container {
            padding: 20px;
            background-color: var(--bg-color);
            display: flex;
            gap: 10px;
        }
        #api-key-input, #user-input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--input-bg);
            color: white;
            font-size: 1rem;
        }
        #api-key-input { width: 250px; }
        #user-input { flex: 1; }
        button {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        .loading { font-style: italic; color: #888; }
    </style>

    <!-- Import Map für das Google Gen AI SDK -->
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai"
            }
        }
    </script>
</head>
<body>

    <header>✨ Gemini AI Schnittstelle</header>

    <div id="chat-container">
        <div class="message gemini-message">Hallo! Gib oben oder unten deinen API-Key ein und schreibe mir eine Nachricht.</div>
    </div>

    <div id="input-container">
        <input type="password" id="api-key-input" placeholder="Google AI Studio API Key hier einfügen...">
        <input type="text" id="user-input" placeholder="Frage Gemini etwas..." disabled>
        <button id="send-btn" disabled>Senden</button>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        const apiKeyInput = document.getElementById("api-key-input");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatContainer = document.getElementById("chat-container");

        // API Key Überprüfung beim Tippen
        apiKeyInput.addEventListener("input", () => {
            const hasKey = apiKeyInput.value.trim().length > 0;
            userInput.disabled = !hasKey;
            sendBtn.disabled = !hasKey;
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            if (!text || !apiKey) return;

            // User Nachricht hinzufügen
            appendMessage(text, "user-message");
            userInput.value = "";

            // Lade-Anzeige für Gemini
            const loadingId = "loading-" + Date.now();
            appendMessage("Gemini überlegt...", "gemini-message loading", loadingId);

            try {
                // Initialisiere die Google Gen AI Instanz
                const genAI = new GoogleGenerativeAI(apiKey);
                // Nutzt das standardmäßige kostenlose Modell gemini-3.6-flash
                const model = genAI.getGenerativeModel({ model: "gemini-3.6-flash" });

                const result = await model.generateContent(text);
                const response = await result.response;
                const replyText = response.text();

                // Lade-Anzeige entfernen und Antwort einfügen
                document.getElementById(loadingId).remove();
                appendMessage(replyText, "gemini-message");

            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).remove();
                appendMessage("Fehler: Verbindung fehlgeschlagen. Überprüfe deinen API-Key.", "gemini-message");
            }
        }

        function appendMessage(text, className, id = null) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            if (id) msgDiv.id = id;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
