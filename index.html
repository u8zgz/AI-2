<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldefreier Gemini Chat</title>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1f20;
            --text-color: #e3e3e3;
            --input-bg: #282a2d;
            --accent-color: #ff4757;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; display: flex; flex-direction: column; height: 100vh;
        }
        header { background-color: var(--chat-bg); padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #333; }
        #chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; }
        .user-message { background-color: var(--accent-color); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .gemini-message { background-color: var(--chat-bg); align-self: flex-start; border-bottom-left-radius: 4px; }
        #input-container { padding: 20px; display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background-color: var(--input-bg); color: white; }
        button { padding: 12px 24px; background-color: var(--accent-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .loading { font-style: italic; color: #888; }
    </style>
</head>
<body>

    <header>🤖 Gemini Proxy Chat (Keine Anmeldung nötig)</header>

    <div id="chat-container">
        <div class="message gemini-message">Hallo! Frag mich einfach etwas. Keine Registrierung, kein Login notwendig.</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Schreibe eine Nachricht...">
        <button id="send-btn">Senden</button>
    </div>

    <script>
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatContainer = document.getElementById("chat-container");

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, "user-message");
            userInput.value = "";

            const loadingId = "loading-" + Date.now();
            appendMessage("Gemini antwortet gleich...", "gemini-message loading", loadingId);

            try {
                // Sendet die Nachricht an dein eigenes Node.js Backend auf Render
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();
                appendMessage(data.reply, "gemini-message");

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Fehler beim Abrufen der Antwort.", "gemini-message");
            }
        }

        function appendMessage(text, className, id = null) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            if (id) msgDiv.id = id;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
