<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kostenloser Gemini Chat (Ohne API Key)</title>
    <style>
        :root {
            --bg-color: #131314;
            --chat-bg: #1e1f20;
            --text-color: #e3e3e3;
            --input-bg: #282a2d;
            --accent-color: #00a8ff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--chat-bg);
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .gemini-message {
            background-color: var(--chat-bg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #input-container {
            padding: 20px;
            background-color: var(--bg-color);
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--input-bg);
            color: white;
            font-size: 1rem;
        }
        button {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        .loading { font-style: italic; color: #888; }
    </style>

    <!-- Einbinden des kostenlosen Puter AI SDKs -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>

    <header>🚀 Gemini Chat (Kein Key erforderlich)</header>

    <div id="chat-container">
        <div class="message gemini-message">Hallo! Ich bin Gemini. Frag mich einfach etwas, ganz ohne API-Key!</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Frage Gemini etwas...">
        <button id="send-btn">Senden</button>
    </div>

    <script>
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatContainer = document.getElementById("chat-container");

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // User-Nachricht anzeigen
            appendMessage(text, "user-message");
            userInput.value = "";

            // Lade-Anzeige für Gemini erstellen
            const loadingId = "loading-" + Date.now();
            appendMessage("Gemini überlegt...", "gemini-message loading", loadingId);

            try {
                // Kostenloser API-Aufruf über die Puter-Infrastruktur
                const response = await puter.ai.chat(text, { model: 'gemini-3.8-flash' });
                
                // Lade-Anzeige entfernen und echte Antwort anzeigen
                document.getElementById(loadingId).remove();
                appendMessage(response, "gemini-message");

            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).remove();
                appendMessage("Fehler: Verbindung zum AI-Dienst fehlgeschlagen.", "gemini-message");
            }
        }

        function appendMessage(text, className, id = null) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            if (id) msgDiv.id = id;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
